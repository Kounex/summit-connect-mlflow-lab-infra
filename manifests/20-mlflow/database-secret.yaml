apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: database-password
parameters:
- name: LAB_NAMESPACE
  description: Fixed infrastructure namespace; parameterized to preserve it during native Template processing
  value: tableschnappi-demo
  required: true
- name: DATABASE_PASSWORD
  generate: expression
  from: '[a-f0-9]{48}'
objects:
- apiVersion: v1
  kind: Secret
  metadata:
    name: darmstadt-mlflow-db
    namespace: ${LAB_NAMESPACE}
    labels:
      event.redhat.com/owner: darmstadt-demo
  type: Opaque
  stringData:
    password: ${DATABASE_PASSWORD}
