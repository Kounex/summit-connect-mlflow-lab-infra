---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: tableschnappi-frontend
  namespace: tableschnappi-demo
  labels:
    event.redhat.com/owner: darmstadt-demo
  annotations:
    event.redhat.com/source-commit: 7e8f6436c1d1ca4f9dbdcd4ae1dedd32146230c9
spec:
  runPolicy: Serial
  source:
    type: Git
    git:
      uri: https://github.com/Kounex/tableschnappi.git
      ref: 7e8f6436c1d1ca4f9dbdcd4ae1dedd32146230c9
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: packages/frontend/Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: tableschnappi-frontend:7e8f643
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: '2'
      memory: 3Gi
  successfulBuildsHistoryLimit: 1
  failedBuildsHistoryLimit: 2
