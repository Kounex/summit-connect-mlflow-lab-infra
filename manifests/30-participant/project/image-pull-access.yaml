apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: participant-image-pull-access
parameters:
- name: PARTICIPANT
  description: OpenShift identity user1 through user50
  required: true
- name: LAB_NAMESPACE
  description: Fixed infrastructure namespace; parameterized to preserve it during native Template processing
  value: tableschnappi-demo
  required: true
objects:
- apiVersion: rbac.authorization.k8s.io/v1
  kind: RoleBinding
  metadata:
    name: restaurant-image-puller-${PARTICIPANT}
    namespace: ${LAB_NAMESPACE}
    labels:
      event.redhat.com/owner: darmstadt-demo
      event.redhat.com/participant: ${PARTICIPANT}
  subjects:
  - kind: Group
    name: system:serviceaccounts:tableschnappi-${PARTICIPANT}
    apiGroup: rbac.authorization.k8s.io
  roleRef:
    kind: ClusterRole
    name: system:image-puller
    apiGroup: rbac.authorization.k8s.io
